<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TPO — Customer Data Platform</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <aside class="sidebar">
      <a class="brand" href="/" aria-label="TPO home"
        ><span class="brand-mark">t</span
        ><span>tpo<span class="brand-dot">.</span></span
        ><small>DATA PLATFORM</small></a
      >
      <div class="workspace">
        <span class="workspace-icon">T</span>
        <div>The Pour Over<small>Customer workspace</small></div>
        <span class="live-dot"></span>
      </div>
      <div class="nav-label">WORKSPACE</div>
      <nav id="nav">
        <a href="/" data-view="overview" class="active"
          ><span>◫</span> Overview</a
        >
        <a href="/people" data-view="people"
          ><span>♙</span> People <small id="nav-count"></small
        ></a>
        <a href="/segments" data-view="segments"><span>◎</span> Segments</a>
        <a href="/sources" data-view="sources"
          ><span>⇄</span> Sources &amp; imports</a
        >
        <a href="/attributes" data-view="attributes"
          ><span>▤</span> Attributes</a
        >
        <a href="/connections" data-view="connections"
          ><span>⌘</span> Connections</a
        >
        <a href="/assistant" data-view="assistant"
          ><span>✧</span> Growth assistant</a
        >
      </nav>
      <div class="sidebar-bottom">
        <span class="live-dot"></span> Local workspace<small
          >Your data stays on this device.</small
        >
        <div class="user">
          <span>TP</span>
          <div>The Pour Over<small>Workspace owner</small></div>
        </div>
      </div>
    </aside>
    <div class="shell">
      <header class="topbar">
        <span id="breadcrumb">Workspace <b>/</b> Overview</span>
        <div>
          <span class="environment">● Local</span
          ><button class="button primary" id="global-import">
            ＋ Import CSV
          </button>
        </div>
      </header>
      <main id="main">
        <div class="loading">Loading your customer data…</div>
      </main>
    </div>
    <div id="overlay"></div>
    <div id="toast" role="status" aria-live="polite"></div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
